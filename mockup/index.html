<!doctype html>
<html lang="es">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>HLA · Memoria Anual 2025 · Prototipo v5</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Antonio:wght@100..700&family=IBM+Plex+Mono:wght@400;500&display=swap" rel="stylesheet">
<style>
/* ============================================================
   MEMORIA HLA 2025 · v5.4
   Dos voces: Antonio (display/cifras) + IBM Plex Mono (resto)
   Planitud radical: radius 0 · sin sombras · hairlines de 1px
   ============================================================ */
:root{
  --violeta:#4D418A; --gris:#63666F; --azul:#639AB7; --agua:#A8D3CE; --rosa:#CF0C71;
  --paper:#F4F3F1; --paper2:#EAE9E6; --ink:#1F1D2B; --line:#DDDCD9; --mass:#C7C8CB;
  --display:'Antonio',sans-serif; --mono:'IBM Plex Mono',monospace;
  --pad:clamp(28px,4vw,72px);
}
*{box-sizing:border-box;border-radius:0!important}
html{scroll-behavior:smooth}
body{margin:0;background:var(--paper);color:var(--ink);font-family:var(--mono);
  font-size:0.875rem;line-height:1.7;-webkit-font-smoothing:antialiased;overflow-x:hidden;
  min-height:100svh;display:flex;flex-direction:column}
main{flex:1;padding-bottom:40px}
.wrap{width:100%;margin:0;padding:0 var(--pad)}
:focus-visible{outline:2px solid var(--violeta);outline-offset:3px}
::selection{background:var(--violeta);color:#fff}

.eyebrow{font-family:var(--mono);font-size:0.75rem;font-weight:400;letter-spacing:.16em;
  text-transform:uppercase;color:var(--gris)}
.caption{font-family:var(--mono);font-size:0.75rem;font-weight:400;letter-spacing:.10em;
  text-transform:uppercase;color:var(--ink);line-height:1.55}
.delta{font-family:var(--mono);font-size:0.75rem;letter-spacing:.04em;color:var(--gris)}

/* ============ NAV ============ */
header{position:sticky;top:0;z-index:50;background:color-mix(in srgb,var(--paper) 92%,transparent);
  backdrop-filter:blur(8px);border-bottom:1px solid var(--line)}
nav{display:flex;align-items:stretch;justify-content:space-between;gap:2px;
  width:100%;margin:0;padding:0 var(--pad);min-height:64px;flex-wrap:wrap}
.logo{display:block;width:168px;flex:0 0 auto;align-self:center;height:40px;background:var(--violeta);
  -webkit-mask:url("assets/hla-logo.svg") no-repeat center/contain;
          mask:url("assets/hla-logo.svg") no-repeat center/contain}
.tab{appearance:none;border:0;background:none;cursor:pointer;color:var(--gris);
  font-family:var(--mono);font-size:0.75rem;letter-spacing:.12em;text-transform:uppercase;
  padding:0 8px;display:flex;align-items:center;position:relative;transition:color .2s}
.tab::after{content:"";position:absolute;left:8px;right:8px;bottom:0;height:2px;
  background:var(--violeta);transform:scaleX(0);transition:transform .25s}
.tab:hover{color:var(--ink)}
.tab.active{color:var(--ink)}
.tab.active::after{transform:scaleX(1)}

/* ============ CABECERA DE SECCIÓN ============ */
.section-head{width:100%;margin:42px 0 0;padding:0 var(--pad)}
.head-meta{display:flex;justify-content:space-between;align-items:baseline;gap:16px}
.head-meta .idx{font-family:var(--mono);font-size:0.75rem;letter-spacing:.16em;color:var(--gris)}
.section-title{font-family:var(--display);font-weight:500;text-transform:uppercase;
  font-size:clamp(2.875rem,6.4vw,6.125rem);letter-spacing:.005em;line-height:.92;margin:14px 0 0}
.section-sub{color:var(--gris);font-size:0.8438rem;max-width:62ch;margin:16px 0 0;line-height:1.75;
  letter-spacing:.01em}
/* en escritorio la intro va al lado del título: el contenido sube ~120px */
/* el título nunca se parte por la intro: si no caben juntos, la intro baja */
.head-main{display:flex;flex-wrap:wrap;justify-content:space-between;align-items:flex-end;
  column-gap:clamp(32px,5vw,96px)}
.head-main .section-title{flex:0 0 auto;max-width:100%}
.head-main .section-sub{flex:0 0 min(46ch,100%);margin:14px 0 6px}
.head-main .section-sub[hidden]{display:none}
.head-rule{height:1px;background:var(--line);border:0;margin:28px 0 0}

/* ============ ESCENARIO (Indicadores) ============ */
.stage{position:relative;display:flex;align-items:center;padding:52px 0 64px}
#indicadores.stage{min-height:66vh;padding:40px 0 48px}
.grid{position:relative;display:grid;grid-template-columns:1fr minmax(460px,560px) 1fr;
  gap:clamp(56px,7vw,130px);align-items:center;width:100%}
.col{display:flex;flex-direction:column;gap:clamp(14px,2vh,22px)}
.col.left{align-items:flex-end;text-align:right}
.col.right{align-items:flex-start}

#wires{position:absolute;inset:0;width:100%;height:100%;pointer-events:none;overflow:visible}
#wires path{fill:none;stroke:var(--mass);stroke-width:1;transition:stroke .25s,opacity .25s}
#wires path.hot{stroke:var(--rosa)}
#wires circle{fill:var(--paper);stroke:var(--mass);stroke-width:1;transition:stroke .25s}
#wires circle.hot{stroke:var(--rosa);fill:var(--rosa)}

/* ---- KPI ---- */
.kpi{cursor:pointer;background:none;font:inherit;color:inherit;
  border:1px solid var(--line);padding:16px 24px 18px;width:100%;max-width:420px;
  display:flex;flex-direction:column;text-align:inherit;
  transition:border-color .2s,background .2s,opacity .3s}
.col.left .kpi{align-items:flex-end}
.col.right .kpi{align-items:flex-start}
.kpi:hover,.kpi:focus-visible{border-color:var(--violeta);background:color-mix(in srgb,var(--paper2) 55%,var(--paper))}
.kpi .k-num{font-family:var(--display);font-weight:400;font-variant-numeric:tabular-nums;
  font-size:clamp(2.25rem,3vw,3.25rem);letter-spacing:-.005em;line-height:.86;margin-top:8px;
  transition:color .2s}
.kpi .k-label{margin-top:10px}
.kpi .k-trend{margin-top:4px}
.kpi:hover .k-num,.kpi:focus-visible .k-num{color:var(--violeta)}
.kpi[aria-expanded="true"]{border-color:var(--violeta)}
.kpi[aria-expanded="true"] .k-num{color:var(--violeta)}
/* con un indicador abierto, los demás se apagan sin perder contraste: cifra y borde en gris */
.grid.dim .kpi:not([aria-expanded="true"]) .k-num{color:var(--gris)}
.grid.dim .kpi:not([aria-expanded="true"]):hover .k-num{color:var(--violeta)}
.grid.dim #wires path:not(.hot),.grid.dim #wires circle:not(.hot){opacity:.45}

/* ---- ELEMENTO CENTRAL ---- */
.core{position:relative;min-height:580px;display:flex;align-items:stretch}
#coreStage{width:100%;display:flex}
.core-face{width:100%;min-height:580px;background:transparent;border:1px solid var(--line);
  color:var(--ink);padding:48px 40px;display:flex;flex-direction:column;
  align-items:center;justify-content:center;text-align:center}
.iso{width:96px;height:96px;color:var(--violeta);animation:spin 80s linear infinite}
.iso svg{width:100%;height:100%;display:block}
@keyframes spin{to{transform:rotate(360deg)}}
.core-face .ce-kicker{margin-top:34px}
.core-face .ce-num{font-family:var(--display);font-weight:400;font-size:clamp(3.5rem,5vw,5.25rem);
  line-height:.86;color:var(--violeta);font-variant-numeric:tabular-nums;margin-top:16px}
.core-face .ce-label{margin-top:14px}
.core-face .ce-cta{font-family:var(--mono);font-size:0.75rem;letter-spacing:.14em;
  text-transform:uppercase;color:var(--rosa);margin-top:38px;padding-top:16px;
  border-top:1px solid var(--line);min-width:220px}

.core-chart{width:100%;min-height:580px;background:transparent;border:1px solid var(--line);
  padding:34px 36px 28px;display:flex;flex-direction:column;animation:reveal .35s cubic-bezier(.16,1,.3,1)}
@keyframes reveal{from{opacity:0}to{opacity:1}}
.ch-head{display:flex;justify-content:space-between;align-items:flex-start;gap:12px}
.ch-now{font-family:var(--display);font-weight:400;font-size:clamp(3.5rem,4.8vw,4.875rem);
  line-height:.86;color:var(--violeta);font-variant-numeric:tabular-nums;margin-top:20px}
.ch-delta{margin-top:11px}
/* columnas desde cero: la altura es proporcional al valor real, sin exagerar variaciones */
.ch-plot{position:relative;flex:1;min-height:280px;margin-top:28px;display:grid;
  grid-template-columns:repeat(3,1fr);gap:0;align-items:end;border-bottom:1px solid var(--ink)}
.cy{position:relative;height:100%;display:flex;flex-direction:column;justify-content:flex-end;align-items:center}
.cy-val{font-family:var(--mono);font-size:.875rem;letter-spacing:-.01em;color:var(--ink);
  font-variant-numeric:tabular-nums;margin-bottom:8px;white-space:nowrap}
.cy-bar{width:min(64%,104px);height:var(--h);background:color-mix(in srgb,var(--rosa) 18%,var(--paper));
  border-top:2px solid var(--rosa);transform-origin:bottom}
.cy.now .cy-bar{border-top-color:var(--violeta)}
.cy.now .cy-bar{background:var(--violeta)}
.cy.now .cy-val{color:var(--violeta);font-weight:500}
.cy.pend .cy-bar{height:42%;background:transparent;border:1px dashed var(--gris);border-bottom:0}
.cy.pend .cy-val{color:var(--gris)}
.cy-step{position:absolute;top:1.6rem;transform:translateX(-50%);background:var(--paper);
  font-family:var(--mono);font-size:.75rem;letter-spacing:.02em;color:var(--gris);padding:2px 6px;
  border:1px solid var(--line);white-space:nowrap}
.ch-axis{position:relative;display:grid;grid-template-columns:repeat(3,1fr);margin-top:10px;padding-bottom:2.2rem}
.ch-axis span{font-family:var(--mono);font-size:.75rem;letter-spacing:.10em;color:var(--gris);text-align:center}
.ch-legend{display:flex;gap:18px;margin-top:16px;font-family:var(--mono);font-size:.75rem;color:var(--gris)}
.ch-legend i{display:inline-block;width:10px;height:10px;margin-right:6px;vertical-align:-1px}
.sr-only{position:absolute;width:1px;height:1px;padding:0;margin:-1px;overflow:hidden;clip:rect(0,0,0,0);border:0}
.inline-chart{width:100%}
.inline-chart .core-chart{min-height:0}
.inline-chart .ch-plot{min-height:220px}
.no-anim *{animation:none!important}

/* ============ CRONOGRAMA (Hitos / Innovación) ============ */
.chrono{position:relative;width:100%;padding-top:10px}
.chrono .spine{position:absolute;inset:0;pointer-events:none;overflow:visible}
.chrono .spine path{stroke:var(--mass);stroke-width:1;fill:none}
.chrono .spine .node{transform-box:fill-box;transform-origin:center}
.chrono .row{display:grid;grid-template-columns:repeat(var(--n,4),1fr);gap:clamp(32px,4vw,72px)}
.cl{position:relative;padding-top:64px;max-width:400px}
.cl:nth-child(1){margin-top:64px}
.cl:nth-child(2){margin-top:0}
.cl:nth-child(3){margin-top:120px}
.cl:nth-child(4){margin-top:36px}
.cl .ic{width:46px;height:46px;color:var(--violeta);display:block}
.cl .ic *{fill:none;stroke:currentColor;stroke-width:1.5;stroke-linecap:round;stroke-linejoin:round}
.cl .cl-idx{font-family:var(--mono);font-size:0.75rem;letter-spacing:.16em;color:var(--gris);
  display:block;margin-top:18px}
.cl .cl-n{font-family:var(--display);font-weight:400;font-size:clamp(3.25rem,5vw,5.375rem);
  color:var(--violeta);line-height:.86;letter-spacing:-.005em;margin-top:14px;
  font-variant-numeric:tabular-nums}
.cl h3{font-family:var(--display);font-weight:500;font-size:1.3125rem;letter-spacing:.03em;
  text-transform:uppercase;margin:18px 0 0;line-height:1.1}
.cl .cl-nl{display:block;margin-top:10px;max-width:32ch}
.cl-x{list-style:none;margin:16px 0 0;padding:12px 0 0;border-top:1px solid var(--line)}
.cl-x li{font-size:.78125rem;line-height:1.7;color:var(--ink);letter-spacing:.01em}
.cl p{margin:12px 0 0;color:var(--gris);font-size:0.7812rem;line-height:1.8;max-width:44ch;
  letter-spacing:.01em}

/* ============ SPLIT: dato-tabs + visual (Sociedad/Personas/Cliente/Sost.) ============ */
.split{display:grid;grid-template-columns:1.15fr 1fr;gap:clamp(48px,7vw,140px);
  align-items:start;width:100%}
.viz-holder{position:sticky;top:96px;align-self:start;min-height:480px;display:flex;flex-direction:column;justify-content:center}
.viz{width:100%;display:flex;flex-direction:column;justify-content:center;animation:reveal .4s cubic-bezier(.16,1,.3,1)}
.viz-cap{font-family:var(--mono);font-size:0.75rem;letter-spacing:.14em;text-transform:uppercase;
  color:var(--gris);margin-top:28px;border-top:1px solid var(--line);padding-top:14px}
.figstack{display:flex;flex-direction:column;gap:16px}
.figstack.many{display:grid;grid-template-columns:1fr 1fr;gap:12px}
.figstack.many .fig-block{padding:18px 20px 20px}
.fig-block .f-title{display:block;font-family:var(--display);font-weight:500;text-transform:uppercase;
  font-size:clamp(2rem,2.8vw,3rem);line-height:.9;margin-top:10px;color:var(--ink);transition:color .2s}
.fig-block[aria-pressed="true"] .f-title{color:var(--violeta)}
.viz-story{margin-top:32px;max-width:62ch}
.viz-story h3{font-family:var(--display);font-weight:500;font-size:1.3125rem;letter-spacing:.03em;
  text-transform:uppercase;margin:0;line-height:1.1}
.viz-story p{margin:12px 0 0;color:var(--gris);font-size:.8125rem;line-height:1.8;letter-spacing:.01em}
.dg.sq{border-radius:0!important;aspect-ratio:1.4}
.bars{display:flex;flex-direction:column;gap:18px}
.bar-row{display:grid;grid-template-columns:3.5rem 1fr;align-items:center;gap:14px}
.bar-row .bl{font-family:var(--mono);font-size:.75rem;letter-spacing:.1em;color:var(--gris)}
.bar{position:relative;height:56px;border:1px solid var(--line)}
.bf{position:absolute;inset:0 auto 0 0;width:var(--w);background:var(--violeta)}
.bf.ghost{background:var(--mass)}
.bf .bv{position:absolute;left:12px;top:50%;transform:translateY(-50%);color:#fff;
  font-family:var(--mono);font-size:.9375rem;letter-spacing:-.02em}
.fig-block{appearance:none;font:inherit;color:inherit;text-align:left;cursor:pointer;
  background:none;border:1px solid var(--line);padding:24px 28px 26px;width:100%;
  transition:border-color .2s,background .2s,opacity .3s}
.fig-block:hover,.fig-block:focus-visible{border-color:var(--violeta);
  background:color-mix(in srgb,var(--paper2) 55%,var(--paper))}
.fig-block .f-num{font-family:var(--display);font-weight:400;font-size:clamp(2.5rem,3.6vw,4rem);
  letter-spacing:-.005em;line-height:.86;color:var(--ink);font-variant-numeric:tabular-nums;
  margin-top:10px;transition:color .2s}
.fig-block .f-label{margin-top:12px}
.fig-block .f-sub{color:var(--gris);font-size:0.7812rem;line-height:1.8;margin-top:8px;
  max-width:40ch;letter-spacing:.01em}
.fig-block[aria-pressed="true"]{border-color:var(--violeta)}
.fig-block[aria-pressed="true"] .f-num{color:var(--violeta)}
.figstack.haspick .fig-block:not([aria-pressed="true"]) .f-num,
.figstack.haspick .fig-block:not([aria-pressed="true"]) .f-title{color:var(--gris)}

/* --- piezas de visual --- */
.dotgrid{display:grid;grid-template-columns:repeat(10,1fr);gap:clamp(10px,1.2vw,18px);max-width:560px}
.dg{aspect-ratio:1;border-radius:50%!important;border:1px solid var(--mass);background:transparent}
.dg.on{border-color:var(--violeta);background:var(--violeta)}
.dg.rosa{border-color:var(--rosa);background:var(--rosa)}
.propbar{--w:50%;position:relative;height:64px;border:1px solid var(--line);background:transparent}
.propbar .fill{position:absolute;inset:0 auto 0 0;width:var(--w);background:var(--violeta)}
.propbar .pct{position:absolute;left:12px;top:50%;transform:translateY(-50%);
  color:#fff;font-family:var(--mono);font-size:0.9375rem;letter-spacing:-.02em;z-index:2}
.prop-l{display:flex;justify-content:space-between;margin-top:14px}
.prop-l span{font-family:var(--mono);font-size:0.75rem;letter-spacing:.10em;text-transform:uppercase}
.prop-l .a{color:var(--violeta)}
.prop-l .b{color:var(--gris)}
.ringwrap{position:relative;width:min(380px,80%);aspect-ratio:1;margin:0 auto}
.ringwrap svg{width:100%;height:100%;transform:rotate(-90deg)}
.ring-track{fill:none;stroke:var(--line);stroke-width:1}
.ring-arc{fill:none;stroke:var(--violeta);stroke-width:14}
.ring-c{position:absolute;inset:0;display:flex;flex-direction:column;align-items:center;
  justify-content:center;text-align:center}
.ring-c .rn{font-family:var(--display);font-weight:400;font-size:4.5rem;line-height:.86;color:var(--violeta)}
.bigviz{width:100%;height:auto;display:block;overflow:visible}
.bigviz .hair{stroke:var(--mass);stroke-width:1;fill:none}
.bigviz .vio{stroke:var(--violeta);fill:none;stroke-width:1.5;stroke-linecap:round;stroke-linejoin:round}
.bigviz .ros{stroke:var(--rosa);fill:none;stroke-width:1.5;stroke-linecap:round}
.bigviz .nodedot{fill:var(--violeta)}
.bigviz text{font-family:var(--display);fill:var(--violeta)}

/* ============ MINI-MAPA, RANKING Y VISUALES DE DATO ============ */
.cl-viz{min-height:46px}
.cl-viz .ic{margin-bottom:4px}
.minimapa{width:100%;height:auto;display:block;overflow:visible}
.cl .minimapa{max-width:240px}
.viz .minimapa{max-width:560px}
.minimapa .mpv{fill:none;stroke:var(--line);stroke-width:1;vector-effect:non-scaling-stroke}
.minimapa .md{fill:var(--mass)}
.minimapa .md.on{fill:var(--violeta);stroke:var(--paper);stroke-width:2;vector-effect:non-scaling-stroke}
.minimapa .mh{fill:none;stroke:var(--violeta);stroke-width:1;vector-effect:non-scaling-stroke;opacity:0}
.mm-list{list-style:none;margin:12px 0 0;padding:0}
.mm-list li{font-size:.75rem;line-height:1.7;color:var(--ink);padding-left:16px;position:relative}
.mm-list li::before{content:"";position:absolute;left:0;top:.6em;width:7px;height:7px;border-radius:50%!important;background:var(--violeta)}
.mm-list li span{color:var(--gris)}
.rank{width:100%;max-width:300px;height:auto;display:block;overflow:visible}
.rank .rk-axis,.rank .rk-tick{stroke:var(--mass);stroke-width:1}
.rank .rk-lead{stroke:var(--violeta);stroke-width:1}
.rank .rk-dot{fill:var(--violeta)}
.rank text{font-family:var(--mono);text-anchor:middle}
.rank .rk-n{font-size:.75rem;fill:var(--gris)}
.rank .rk-l{font-size:.75rem;fill:var(--ink)}
.rk-cap{display:block;font-size:.75rem;color:var(--gris);margin-top:6px;max-width:32ch;line-height:1.5}
.pend-line{display:flex;align-items:baseline;gap:14px;flex-wrap:wrap;margin-top:22px;padding:14px 16px;
  border:1px dashed var(--gris);color:var(--gris);font-size:.8125rem}
.pend-line .rn{font-family:var(--display);font-size:1.75rem;line-height:1}
.dg.rest{border-color:var(--mass);background:var(--mass)}
.chat{max-width:440px;border:1px solid var(--line);padding:18px 20px 22px}
.chat-head{display:flex;justify-content:space-between;align-items:baseline;gap:12px;
  padding-bottom:12px;border-bottom:1px solid var(--line);flex-wrap:wrap}
.msg{margin-top:14px;padding:11px 16px;border:1px solid var(--violeta);width:fit-content;max-width:85%;
  font-size:.8125rem;line-height:1.5;color:var(--violeta);background:color-mix(in srgb,var(--violeta) 6%,var(--paper))}
.en-row{padding:20px 0;border-bottom:1px solid var(--line)}
.en-row:first-child{border-top:1px solid var(--line)}
.en-row .caption{display:block;margin-bottom:14px}
.en-flow{display:flex;align-items:center;gap:clamp(14px,2vw,28px);flex-wrap:wrap}
.en-tiles{flex:1 1 220px;max-width:300px;gap:8px}
.en-tiles .dg.on{background:var(--mass);border-color:var(--mass)}
.en-tiles.hl .dg.on{background:var(--violeta);border-color:var(--violeta)}
.en-arrow{width:64px;height:auto;flex:0 0 auto}
.en-arrow path{fill:none;stroke:var(--mass);stroke-width:1.5}
.en-val{font-family:var(--display);font-size:clamp(2.25rem,3.4vw,3.25rem);line-height:.9;color:var(--gris)}
.en-val small{display:block;font-family:var(--mono);font-size:.75rem;letter-spacing:.06em;margin-top:6px}
.en-val.hl{color:var(--violeta)}
.en-sub{display:block;font-size:.75rem;color:var(--gris);margin-top:12px;line-height:1.6}
.propbar.mute .fill{background:var(--paper2)}
.propbar.mute .pct{color:var(--ink)}
.meters{display:flex;flex-direction:column;gap:26px;max-width:560px}
.meter .caption{display:block;margin-bottom:12px}
.track{position:relative;height:1px;background:var(--mass)}
.track i{position:absolute;top:-5px;left:0;width:11px;height:11px;border-radius:50%!important;background:var(--violeta)}
.aero .lbl{font-family:var(--mono);font-size:.9375rem;fill:var(--gris);text-anchor:middle;letter-spacing:.08em}

.aero .fan path{fill:var(--violeta);stroke:none}

/* ============ DATO PENDIENTE ============
   Marca visible de lo que aún no ha llegado del cliente: borde discontinuo + "Pendiente" en gris.
   Se quita sola en cuanto el dato se rellena en KPIS. */
.kpi.is-pending,.fig-block.is-pending{border-style:dashed}
.kpi .k-num.pend,.core-face .ce-num.pend,.ch-now.pend,.fig-block .f-num.pend{color:var(--gris)}

/* ============ GRUPO HLA: red de hospitales ============ */
.red{display:grid;grid-template-columns:1.35fr 1fr;gap:clamp(48px,6vw,120px);align-items:center;width:100%}
.mapa{width:100%;height:auto;display:block;overflow:visible}
.mapa .pv{fill:transparent;stroke:var(--mass);stroke-width:.6;stroke-linejoin:round}
.mapa .pv.hla{fill:color-mix(in srgb,var(--violeta) 16%,transparent);stroke:var(--violeta);
  stroke-width:.8;cursor:pointer;transition:fill .25s,fill-opacity .25s}
.mapa .pv.hla:hover,.mapa .pv.hla.sel{fill:var(--violeta)}
.mapa.has-sel .pv.hla:not(.sel){opacity:.45}
.mapa .pin{cursor:pointer}
.mapa .pin .dot{fill:var(--violeta);stroke:var(--paper);stroke-width:1.2}
.mapa .pin .halo{fill:none;stroke:var(--violeta);stroke-width:.8;opacity:0}
.mapa .pin.sel .dot{fill:var(--paper);stroke:var(--violeta)}
.mapa.has-sel .pin:not(.sel){opacity:.35}
.red-figs{display:flex;flex-wrap:wrap;gap:24px clamp(28px,3vw,52px);border-bottom:1px solid var(--line);padding-bottom:28px}
.r-num{display:block;font-family:var(--display);font-weight:400;font-size:clamp(2.5rem,3.6vw,4rem);

.red-figs .caption{display:block;margin-top:12px}

.prov-btn{appearance:none;font:inherit;color:inherit;cursor:pointer;background:none;text-align:left;

.prov-btn:hover,.prov-btn:focus-visible{border-color:var(--violeta);
  background:color-mix(in srgb,var(--paper2) 55%,var(--paper))}
.prov-btn[aria-pressed="true"]{border-color:var(--violeta);background:var(--violeta);color:#fff}
.prov-btn .pn{font-family:var(--display);font-size:1.375rem;line-height:1;color:var(--violeta)}
.prov-btn[aria-pressed="true"] .pn,.prov-btn[aria-pressed="true"] .caption{color:#fff}
.red-detail{margin-top:24px;min-height:7.5rem}
.red-detail h3{font-family:var(--display);font-weight:500;font-size:1.3125rem;letter-spacing:.03em;
  text-transform:uppercase;margin:0;line-height:1.1}
.red-detail ul{list-style:none;margin:10px 0 0;padding:0}
.red-detail li{color:var(--gris);font-size:.8125rem;line-height:1.8;padding-left:18px;position:relative}
.red-detail li::before{content:"";position:absolute;left:0;top:.62em;width:7px;height:7px;
  border-radius:50%!important;background:var(--violeta)}
.red-detail a{color:inherit;text-decoration:none;border-bottom:1px solid var(--line);transition:color .2s,border-color .2s}
.red-detail a:hover,.red-detail a:focus-visible{color:var(--violeta);border-color:var(--violeta)}
.red-detail p{color:var(--gris);font-size:.8125rem;line-height:1.8;margin:0;max-width:44ch}

/* ============ animaciones (solo con movimiento permitido) ============ */
@media (prefers-reduced-motion:no-preference){
  .ch-plot:not(.no-anim) .cy-bar{transform:scaleY(0);animation:barUp .8s cubic-bezier(.16,1,.3,1) forwards}

  .ch-plot:not(.no-anim) .cy-val,.ch-plot:not(.no-anim) .cy-step{opacity:0;animation:fadeIn .4s forwards}
  @keyframes fadeIn{to{opacity:1}}
  @keyframes trace{to{stroke-dashoffset:0}}

  /* cronograma: la línea se pinta poco a poco, los nodos brotan, los bloques suben */
  .spine:not(.no-anim) .spine-path{stroke-dasharray:1;stroke-dashoffset:1;animation:trace 2s .1s cubic-bezier(.4,0,.2,1) forwards}
  .spine:not(.no-anim) .node{scale:0;animation:pop .4s cubic-bezier(.34,1.56,.64,1) forwards}
  .panel.active .cl{opacity:0;translate:0 18px;animation:rise .6s cubic-bezier(.16,1,.3,1) forwards}
  .panel.active .cl:nth-child(2){animation-delay:.35s}
  .panel.active .cl:nth-child(3){animation-delay:.7s}
  .panel.active .cl:nth-child(4){animation-delay:1.05s}
  @keyframes rise{to{opacity:1;translate:0 0}}
  @keyframes pop{to{scale:1}}

  /* ilustraciones que se dibujan */
  .draw{stroke-dasharray:1;stroke-dashoffset:1;animation:trace 1.5s .25s ease forwards}
  .panel.active .fig-block{opacity:0;translate:0 14px;animation:rise .55s cubic-bezier(.16,1,.3,1) forwards}
  .panel.active .fig-block:nth-child(2){animation-delay:.1s}
  .panel.active .fig-block:nth-child(3){animation-delay:.2s}

  @keyframes sweep{to{stroke-dasharray:var(--pct) 100}}
  .viz .nodedot,.viz .sat{transform-box:fill-box;transform-origin:center;scale:0;animation:pop .35s .5s cubic-bezier(.34,1.56,.64,1) forwards}

  /* mapa: las provincias se trazan de oeste a este, la red se enciende y los hospitales laten */
  .panel.active .mapa .pv{stroke-dasharray:1;stroke-dashoffset:1;animation:trace 1.1s cubic-bezier(.4,0,.2,1) forwards}
  .panel.active .mapa .pv.hla{fill-opacity:0;animation:trace 1.1s cubic-bezier(.4,0,.2,1) forwards,fillIn .6s forwards}
  @keyframes fillIn{to{fill-opacity:1}}
  .panel.active .mapa .pin .dot{transform-box:fill-box;transform-origin:center;scale:0;animation:pop .4s cubic-bezier(.34,1.56,.64,1) forwards}
  .mapa .pin .halo{transform-box:fill-box;transform-origin:center;animation:halo 2.8s cubic-bezier(.16,1,.3,1) infinite}
  @keyframes halo{0%{scale:1;opacity:.7}100%{scale:3.4;opacity:0}}
  .panel.active .prov-btn{opacity:0;translate:0 10px;animation:rise .5s cubic-bezier(.16,1,.3,1) forwards}

  /* mini-mapas, conversación, contadores y aerotermia */
  .minimapa .mh{transform-box:fill-box;transform-origin:center;animation:halo 2.8s cubic-bezier(.16,1,.3,1) infinite}
  .viz .msg{opacity:0;translate:0 10px;animation:rise .5s cubic-bezier(.16,1,.3,1) forwards}
  .track i{animation:scan 3.2s cubic-bezier(.45,0,.55,1) infinite}
  @keyframes scan{0%{left:0}50%{left:calc(100% - 11px)}100%{left:0}}
  .aero .fan{transform-box:fill-box;transform-origin:center;animation:spin 3s linear infinite}
}
@media (prefers-reduced-motion:reduce){

.panel{display:none}

<script>
/* punto de millar también en cifras de 4 dígitos (toLocaleString no lo pone en español: 1521) */
const fmt=n=>Math.round(n).toString().replace(/\B(?=(\d{3})+(?!\d))/g,".");
const reduce=matchMedia("(prefers-reduced-motion:reduce)").matches;
const C={violeta:"#4D418A",rosa:"#CF0C71",gris:"#63666F",line:"#DDDCD9",paper:"#F4F3F1",ink:"#1F1D2B",mass:"#C7C8CB"};
const YEARS=["2023","2024","2025"];

/* ================= DATOS (Word de Vicky, 28/10/2026) =================
   null = dato que aún no ha enviado el cliente: se pinta como "Pendiente". */
const KPIS=[
  {id:"pac",g:"Pacientes",label:"Pacientes atendidos",         vals:[1048207,null,null]},
  {id:"nuevos",g:"Pacientes",label:"Pacientes nuevos",            vals:[298595,null,null]},
  {id:"citas",g:"Consultas",label:"Citas en consultas externas", vals:[3688268,4019720,4273319]},
  {id:"dxi",g:"Diagnóstico",label:"Pruebas de DXI",              vals:[730839,851057,852769]},
  {id:"cir",g:"Cirugía",label:"Cirugías",                    vals:[163892,171077,183515]},
  {id:"urg",g:"Urgencias",label:"Urgencias",                   vals:[567148,565084,567508]},
  {id:"urgdia",g:"Urgencias",label:"Media urgencias/día",         vals:[1554,1509,1521]},
  {id:"ing",g:"Hospitalización",label:"Ingresos",                    vals:[76600,78010,76931]},
  {id:"ocu",g:"Hospitalización",label:"Índice de ocupación",         vals:[48.34,49.25,48.75],pct:true},
  {id:"fact",g:"Economía",label:"Crecimiento facturación",     vals:[2.94,11.26,5.91],pct:true},
];
const PEND="Pendiente";
const pending=v=>v==null;
const fmtPct=v=>v.toLocaleString("es-ES",{minimumFractionDigits:2,maximumFractionDigits:2})+" %";
const fmtK=(k,v)=>k.pct?fmtPct(v):fmt(v);
const LEFT=["pac","nuevos","citas","dxi","cir"], RIGHT=["urg","urgdia","ing","ocu","fact"];
const byId=id=>KPIS.find(k=>k.id===id);

/* iconografía de línea — 24×24, stroke, se dibuja sola (.draw) */
const ICONS={
  star:`<path class="draw" pathLength="1" d="M12 3l2.7 5.6 6.1.9-4.4 4.3 1 6.1-5.4-2.9-5.4 2.9 1-6.1L3.2 9.5l6.1-.9z"/>`,
  coins:`<circle class="draw" pathLength="1" cx="9.5" cy="12" r="6.5"/><path class="draw" pathLength="1" d="M13.5 5.9a6.5 6.5 0 1 1 0 12.2M7 10h5M7 14h5"/>`,
  cross:`<path class="draw" pathLength="1" d="M9.2 3.5h5.6v5.7h5.7v5.6h-5.7v5.7H9.2v-5.7H3.5V9.2h5.7z"/>`,
  building:`<path class="draw" pathLength="1" d="M4 20.5V8l8-4.5L20 8v12.5"/><path class="draw" pathLength="1" d="M10 20.5v-5h4v5M8.5 11h2M13.5 11h2"/>`,
  chip:`<rect class="draw" pathLength="1" x="7" y="7" width="10" height="10"/><path class="draw" pathLength="1" d="M10 7V4M14 7V4M10 20v-3M14 20v-3M7 10H4M7 14H4M20 10h-3M20 14h-3"/>`,
  pulse:`<path class="draw" pathLength="1" d="M3 12h4l2-5 3 10 2.5-5H21"/>`,
  ribbon:`<circle class="draw" pathLength="1" cx="12" cy="7" r="3.5"/><path class="draw" pathLength="1" d="M9.8 9.9 5.5 21l4.2-2.6M14.2 9.9 18.5 21l-4.2-2.6"/>`,
  cap:`<path class="draw" pathLength="1" d="M2.5 9 12 4.5 21.5 9 12 13.5z"/><path class="draw" pathLength="1" d="M6.5 11.2v4.8c0 1.6 2.5 3 5.5 3s5.5-1.4 5.5-3v-4.8M21.5 9v6"/>`,
  arm:`<path class="draw" pathLength="1" d="M4 20.5h9M6.5 20.5v-3h4v3M8.5 17.5 11.8 9.6l6 2.6"/><circle class="draw" pathLength="1" cx="11.5" cy="8.5" r="1.8"/><path class="draw" pathLength="1" d="M17.8 12.2l2.6-1.8M17.8 12.2l1 3"/>`,
  cycle:`<path class="draw" pathLength="1" d="M19.5 12a7.5 7.5 0 0 1-13 5.1M4.5 12a7.5 7.5 0 0 1 13-5.1"/><path class="draw" pathLength="1" d="M17.5 3v4h-4M6.5 21v-4h4"/>`,
  seal:`<circle class="draw" pathLength="1" cx="12" cy="9" r="5.5"/><path class="draw" pathLength="1" d="M9 13.5 7.2 21l4.8-2.8L16.8 21 15 13.5M10 9l1.6 1.6L14.4 7"/>`,
};
const icon=k=>`<svg class="ic" viewBox="0 0 24 24" aria-hidden="true">${ICONS[k]}</svg>`;

/* ================= GRUPO HLA: mapa de la red =================
   Centros, nombres y coordenadas tomados de grupohla.com/hospitales-clinicas (ficha de cada centro, 29/10/2026).
   El reparto por provincia coincide con el mapa del Word de Vicky (Imagen 1). */
const RED_HLA=[
  {p:"Zaragoza",   h:[{n:"HLA Clínica Montpellier",u:"hlaclinicamontpellier",ll:[41.6359,-0.9159]}]},
  {p:"Lleida",     h:[{n:"HLA Clínica Perpetuo Socorro",u:"hlaclinicaperpetuosocorro",ll:[41.6574,0.6106]}]},
  {p:"Barcelona",  h:[{n:"HLA Clínica Internacional Barcelona",u:"hlaclinicaintbarcelona",ll:[41.4011,2.1249]}]},
  {p:"Guadalajara",h:[{n:"HLA Clínica Dr. Sanz Vázquez",u:"hlaclinicasanzvazquez",ll:[40.6304,-3.1661]}]},
  {p:"Madrid",     h:[{n:"HLA Hospital Universitario Moncloa",u:"hlahospitalmoncloa",ll:[40.4339,-3.7345]}]},
  {p:"Albacete",   h:[{n:"HLA Clínica El Rosario",u:"hlaclinicaelrosario",ll:[38.9877,-1.8612]}]},
  {p:"Alicante",   h:[{n:"HLA Hospital San Carlos de Denia",u:"hlahospitalsancarlos",ll:[38.8384,0.0931]},
                      {n:"HLA Clínica Vistahermosa",u:"hlaclinicavistahermosa",ll:[38.3633,-0.4639]}]},
  {p:"Murcia",     h:[{n:"HLA Hospital La Vega",u:"hlahospitallavega",ll:[37.9931,-1.1334]},
                      {n:"HLA Residencia Belén",u:"hlaresidenciabelen",ll:[37.9989,-1.1307]}]},
  {p:"Almería",    h:[{n:"HLA Hospital Mediterráneo",u:"hlahospitalmediterraneo",ll:[36.8207,-2.4354]}]},
  {p:"Granada",    h:[{n:"HLA Hospital Universitario Inmaculada",u:"hlahospitalinmaculada",ll:[37.1642,-3.6082]}]},
  {p:"Málaga",     h:[{n:"HLA Hospital Universitario El Ángel",u:"hlahospitalelangel",ll:[36.7153,-4.4535]}]},
  {p:"Cádiz",      h:[{n:"HLA Hospital La Salud",u:"hlahospitallasalud",ll:[36.5324,-6.2957]},
                      {n:"HLA Hospital Jerez Puerta del Sur",u:"hlahospitaljerez",ll:[36.6696,-6.1399]},
                      {n:"HLA Clínica Serman",u:"hlaclinicaserman",ll:[36.6928,-6.1242]}]},
  {p:"Sevilla",    h:[{n:"HLA Clínica Santa Isabel",u:"hlaclinicasantaisabel",ll:[37.3871,-5.9751]}]},
  {p:"Huelva",     h:[{n:"HLA Clínica Los Naranjos",u:"hlaclinicalosnaranjos",ll:[37.2625,-6.9493]}]},
];
const xy=([lat,lon])=>[(lon*MAPA.k-MAPA.minx)*MAPA.s,(-lat-MAPA.miny)*MAPA.s];
const N_HOSP=RED_HLA.reduce((a,r)=>a+r.h.length,0);

/* posición de cada centro en el mapa; los que caen casi encima (Murcia, Jerez) se separan lo justo para verse */
const HOSP=RED_HLA.flatMap(r=>r.h.map(c=>({...c,p:r.p,xy:xy(c.ll)})));
for(let it=0;it<20;it++)HOSP.forEach(a=>HOSP.forEach(b=>{
  if(a===b)return;
  const dx=b.xy[0]-a.xy[0],dy=b.xy[1]-a.xy[1],d=Math.hypot(dx,dy)||.01;
  if(d<8.5){const m=(8.5-d)/2,ux=d>.01?dx/d:1,uy=d>.01?dy/d:0;
    a.xy[0]-=ux*m;a.xy[1]-=uy*m;b.xy[0]+=ux*m;b.xy[1]+=uy*m;}
}));
const hosp=u=>HOSP.find(h=>h.u===u);

/* mini-mapa: la red entera en gris y resaltados los centros de los que habla el dato */
const PROV_D=Object.values(PROV);
function miniMap(us,label){
  const on=new Set(us);
  return `<svg class="minimapa" viewBox="0 0 ${MAPA.w} ${MAPA.h}" role="img" aria-label="${label}">

const deltaTxt=k=>{
  const last=k.vals.at(-1),prev=k.vals.at(-2);
  if(pending(last))return `Dato ${YEARS[2]} pendiente`;
  if(pending(prev))return `Sin dato ${YEARS[1]} para comparar`;
  if(k.pct){const d=last-prev;return `${d>=0?"↑":"↓"} ${Math.abs(d).toFixed(2).replace('.',',')} p.p. vs ${YEARS[1]}`}
  const pct=((last-prev)/prev)*100;
  return `${pct>=0?"↑":"↓"} ${Math.abs(pct).toFixed(1).replace('.',',')} % vs ${YEARS[1]}`;
};
function countUp(elm,dur=1300){
  if(!elm.dataset.target)return;
  const target=+elm.dataset.target, f=elm.dataset.pct?v=>fmtPct(v):v=>fmt(Math.round(v));
  if(reduce){elm.textContent=f(target);return}
  const t0=performance.now();
  (function step(t){const p=Math.min((t-t0)/dur,1),e=1-Math.pow(1-p,3);
    elm.textContent=f(target*e);if(p<1)requestAnimationFrame(step);else wireUp(hotNow());})(t0);
}

/* ================= CONECTORES =================
   Cada tarjeta entra al centro por su propio punto de anclaje, repartido a lo largo del borde:
   así todas conectan aunque la columna de tarjetas sea más alta que el centro. */
const wires=document.getElementById("wires");
const stageGrid=document.getElementById("stageGrid");
function wireUp(hotId){
  if(NARROW()){wires.innerHTML="";return}
  const g=stageGrid.getBoundingClientRect();
  const core=stageGrid.querySelector(".core").getBoundingClientRect();
  const sides={l:[],r:[]};
  document.querySelectorAll("#indicadores .kpi").forEach(k=>{
    const r=k.getBoundingClientRect(), left=r.left<core.left;
    sides[left?"l":"r"].push({id:k.dataset.kpi,y:r.top+r.height/2-g.top,
      x1:left?(r.right-g.left):(r.left-g.left), x2:left?(core.left-g.left):(core.right-g.left)});
  });
  const pad=Math.min(72,core.height*.12), top=core.top-g.top+pad, span=core.height-2*pad;
  let s="";
  Object.values(sides).forEach(list=>{
    list.sort((a,b)=>a.y-b.y);
    list.forEach((c,i)=>{
      const py=list.length>1?top+span*i/(list.length-1):top+span/2, mx=(c.x1+c.x2)/2, hot=c.id===hotId?' class="hot"':"";
      s+=`<path${hot} d="M${c.x1} ${c.y} C${mx} ${c.y} ${mx} ${py} ${c.x2} ${py}"/><circle${hot} cx="${c.x2}" cy="${py}" r="3.5"/>`;
    });
  });
  wires.setAttribute("viewBox",`0 0 ${g.width} ${g.height}`);
  wires.innerHTML=s;
}

function drawChrono(id,animate){
  const el=document.getElementById(id+"-chrono");
  const svg=el.querySelector(".spine");
  if(innerWidth<=960){svg.innerHTML="";return}
  const R=el.getBoundingClientRect();
  if(!R.width)return;
  const pts=[...el.querySelectorAll(".cl")].map(it=>{
    const r=it.getBoundingClientRect();
    return {x:r.left+r.width/2-R.left, y:r.top-R.top-24};
  });
  svg.setAttribute("width",R.width);svg.setAttribute("height",R.height);
  svg.setAttribute("viewBox",`0 0 ${R.width} ${R.height}`);
  /* la línea sube y baja: curvas en S entre nodos, de borde a borde */
  let d=`M-2 ${pts[0].y} L${Math.max(pts[0].x-160,0)} ${pts[0].y}`;
  d+=` L${pts[0].x} ${pts[0].y}`;
  for(let i=0;i<pts.length-1;i++){
    const a=pts[i],b=pts[i+1],mx=(a.x+b.x)/2;
    d+=` C${mx} ${a.y} ${mx} ${b.y} ${b.x} ${b.y}`;
  }
  d+=` L${R.width+2} ${pts.at(-1).y}`;
  const nodes=pts.map((p,i)=>
    `<circle class="node" style="animation-delay:${.4+i*.35}s" cx="${p.x}" cy="${p.y}" r="5" fill="${C.paper}" stroke="${C.violeta}" stroke-width="1"/>`).join("");
  svg.classList.toggle("no-anim",!animate);
  svg.innerHTML=`<path class="spine-path" pathLength="1" d="${d}"/>${nodes}`;
}

      :`<div class="prop-l"><span class="a">Mujeres · ${w} %</span><span class="b">Hombres · ${100-w} %</span></div>`}
    ${cap("Más de 4.000 profesionales · cada punto, 40")}</div>`;

const ST={
  musica:{t:"La música también cuida",p:["La colaboración de Fundación ASISA con Músicos por la Salud amplió durante 2025 su presencia desde HLA Universitario Moncloa a HLA La Vega, HLA Vistahermosa y HLA Jerez Puerta del Sur, acercando la música a pacientes hospitalizados como parte del compromiso con la humanización de la asistencia."]},
  bioetica:{t:"La bioética, en el centro de la práctica sanitaria",p:[
    "El Grupo ASISA reforzó en 2025 su actividad en formación, reflexión y colaboración en bioética.",
    "Durante 2025, el Grupo ASISA mantuvo su compromiso con la reflexión y la formación en bioética a través de su participación en la International Chair in Bioethics y de la actividad de su Comité de Bioética y Derecho Sanitario.",
    "En este contexto, el Hospital HLA Universitario Moncloa recibió la visita del profesor Kenneth Goodman, director emérito del Instituto de Bioética y Política de Salud de la Facultad de Medicina Miller de la Universidad de Miami, quien impartió una conferencia sobre los retos actuales de la bioética aplicada a la asistencia sanitaria."]},
  formacion:{t:"Formación adaptada a cada profesional",p:[
    "El plan de formación de HLA combina formación normativa, capacitación estratégica, desarrollo de habilidades, herramientas digitales y programas de especialización clínica.",
    "Además, el modelo incorpora formación a demanda, de manera que cada centro y cada unidad pueden solicitar contenidos específicos adaptados a sus necesidades y a su realidad asistencial.",
    "La oferta se estructura en tres grandes áreas: habilidades transversales, formación continuada para profesionales sanitarios y contenidos legales y de seguridad."]},
  ia:{t:"Aplicamos la inteligencia artificial para facilitar la experiencia del paciente",p:[
    "La red incorporó un nuevo sistema de citación a través de WhatsApp que permite gestionar citas, enviar avisos y facilitar la programación de pruebas. El asistente virtual Julia Eniax utiliza inteligencia artificial para interpretar las interacciones con los pacientes y contribuir a una gestión más eficiente de las agendas."]},
};

function selectDatum(id,i){
  const grid=document.getElementById(id+"-grid");
  grid.querySelectorAll(".fig-block").forEach((b,j)=>b.setAttribute("aria-pressed",j===i));
  grid.querySelector(".figstack").classList.add("haspick");
  const d=SPLITS[id][i];
  grid.querySelector(".viz-holder").innerHTML=d.viz()+story(d.story);
}
function renderSplit(id){
  const grid=document.getElementById(id+"-grid");
  const data=SPLITS[id];
  grid.innerHTML=`<div class="viz-holder" aria-live="polite"></div>
    <div class="figstack${data.length>3?" many":""}">${data.map((d,i)=>`
      <button class="fig-block${d.pend?" is-pending":""}" data-i="${i}" aria-pressed="${i===0}" style="animation-delay:${i*.08}s">
        ${d.pend?`<span class="f-num pend" style="display:block">${PEND}</span>`
          :d.num?`<span class="f-num" style="display:block">${d.num}</span>`
          :`<span class="f-title">${d.title}</span>`}
        <span class="f-label caption" style="display:block">${d.label}</span>
        ${d.sub?`<span class="f-sub" style="display:block">${d.sub}</span>`:""}
      </button>`).join("")}</div>`;
  grid.querySelectorAll(".fig-block").forEach(b=>
    b.addEventListener("click",()=>selectDatum(id,+b.dataset.i)));
  selectDatum(id,0);
}
Object.keys(SPLITS).forEach(renderSplit);

function renderRed(){
  const el=document.getElementById("grupo-red");
  const hla=new Set(RED_HLA.map(r=>r.p));
  /* trazo de oeste a este; las provincias HLA se rellenan al terminar */
  const provs=Object.entries(PROV).map(([n,d])=>{
    const t=PROV_C[n][0]/MAPA.w, on=hla.has(n);
    const delay=on?`${(t*1.1).toFixed(2)}s,${(1.1+t*.6).toFixed(2)}s`:`${(t*1.1).toFixed(2)}s`;
    return `<path class="pv${on?" hla":""}" pathLength="1" d="${d}" style="animation-delay:${delay}"${on?` data-p="${n}"`:""}/>`;
  }).join("");
  const pins=RED_HLA.map(r=>`<g class="pin" data-p="${r.p}">${HOSP.map((q,i)=>{
      if(q.p!==r.p)return "";
      const [px,py]=q.xy.map(v=>v.toFixed(1)), d=(1.7+i*.07).toFixed(2);
      return `<circle class="halo" cx="${px}" cy="${py}" r="4" style="animation-delay:${d}s"/><circle class="dot" cx="${px}" cy="${py}" r="4" style="animation-delay:${d}s"/>`;
    }).join("")}</g>`).join("");
  el.innerHTML=`<div class="red-map">
      <svg class="mapa" viewBox="0 0 ${MAPA.w} ${MAPA.h}" role="img"
        aria-label="Mapa de España con los ${N_HOSP} hospitales HLA en ${RED_HLA.length} provincias">${provs}${pins}</svg>
      ${cap(`${N_HOSP} hospitales en ${RED_HLA.length} provincias · pincha una para ver sus centros`)}
    </div>
    <div class="red-side">
      <div class="red-figs">
        <div><span class="eyebrow">La red</span><span class="r-num" data-target="18">0</span><span class="caption">Hospitales</span></div>
        <div><span class="eyebrow">La red</span><span class="r-num" data-target="20">0</span><span class="caption">Centros médicos</span></div>
        <div><span class="eyebrow">Dato 2025</span><span class="r-num">451,97 M€</span><span class="caption">Facturación</span><span class="delta">↑ 5,91 % vs 2024</span></div>
      </div>
      <div class="prov-list">${RED_HLA.map((r,i)=>
        `<button class="prov-btn" data-p="${r.p}" aria-pressed="false" style="animation-delay:${.3+i*.04}s">
          <span class="caption">${r.p}</span><span class="pn">${r.h.length}</span></button>`).join("")}</div>
      <div class="red-detail" aria-live="polite"></div>
    </div>`;
  const toggle=n=>selectProv(el.querySelector(`.prov-btn[data-p="${n}"]`).getAttribute("aria-pressed")==="true"?null:n);
  el.querySelector(".mapa").addEventListener("click",e=>{const t=e.target.closest("[data-p]");if(t)toggle(t.dataset.p)});
  el.querySelectorAll(".prov-btn").forEach(b=>b.addEventListener("click",()=>toggle(b.dataset.p)));
  selectProv(null);
}
function selectProv(n){
  const el=document.getElementById("grupo-red");
  el.querySelector(".mapa").classList.toggle("has-sel",!!n);
  el.querySelectorAll(".mapa [data-p]").forEach(g=>g.classList.toggle("sel",g.dataset.p===n));
  el.querySelectorAll(".prov-btn").forEach(b=>b.setAttribute("aria-pressed",b.dataset.p===n));
  const r=RED_HLA.find(r=>r.p===n);
  el.querySelector(".red-detail").innerHTML=r
    ?`<h3>${r.p}</h3><ul>${r.h.map(c=>`<li><a href="https://www.grupohla.com/${c.u}" target="_blank" rel="noopener">${c.n}</a></li>`).join("")}</ul>`
    :`<p>Selecciona una provincia en el mapa o en la lista para ver sus hospitales.</p>`;
}
renderRed();

/* ================= count-up KPIs ================= */
const io=new IntersectionObserver(es=>es.forEach(e=>{
  if(e.isIntersecting){countUp(e.target);io.unobserve(e.target)}}),{threshold:.5});
document.querySelectorAll(".k-num[data-target],.r-num[data-target]").forEach(n=>io.observe(n));

/* ================= tabs de sección ================= */
const head={eyebrow:document.getElementById("eyebrow"),title:document.getElementById("secTitle"),
  sub:document.getElementById("secSub"),idx:document.getElementById("secIdx")};
function setSection(id){
  document.querySelectorAll(".tab").forEach(t=>{
    const on=t.dataset.tab===id;
    t.classList.toggle("active",on);
    if(on)t.setAttribute("aria-current","true");else t.removeAttribute("aria-current");
  });
  document.querySelectorAll(".panel").forEach(p=>p.classList.toggle("active",p.id===id));
  const s=SECTIONS[id];
  head.eyebrow.textContent=s.eyebrow;head.title.innerHTML=s.title;
  const order=[...document.querySelectorAll(".tab")].map(t=>t.dataset.tab);
  const pad=n=>String(n).padStart(2,"0");
  head.sub.textContent=s.sub;head.sub.hidden=!s.sub;head.idx.textContent=`${pad(order.indexOf(id)+1)} / ${pad(order.length)}`;
  if(id==="indicadores"){defaultCore();requestAnimationFrame(()=>wireUp())}
  if(id==="hitos"||id==="innovacion")requestAnimationFrame(()=>drawChrono(id,true));
  if(SPLITS[id])selectDatum(id,0);
  /* en móvil el menú se desliza: que la pestaña activa quede a la vista */
  document.querySelector(`.tab[data-tab="${id}"]`).scrollIntoView({inline:"center",block:"nearest",behavior:reduce?"auto":"smooth"});
  if(id==="grupo")selectProv(null);
  scrollTo({top:0,behavior:reduce?"auto":"smooth"});
}
document.querySelectorAll(".tab").forEach(t=>t.addEventListener("click",()=>setSection(t.dataset.tab)));

defaultCore();
requestAnimationFrame(()=>wireUp());
</script>
